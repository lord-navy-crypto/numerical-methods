name: Feature request
description: Propose a focused numerical or interface improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    attributes:
      label: Problem
      description: What limitation should be addressed?
    validations:
      required: true
  - type: textarea
    attributes:
      label: Proposed change
      description: Explain the algorithm, display, or workflow change.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Validation plan
      description: State how correctness and numerical accuracy should be tested.
    validations:
      required: true
