name: Bug report
description: Report a reproducible calculation or interface defect
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    attributes:
      label: What happened?
      description: Include the expected and observed behavior.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Reproduction settings
      description: Include x range, method, dtype, oracle, precision, tolerance, and term limit.
    validations:
      required: true
  - type: input
    attributes:
      label: Environment
      description: Operating system and Python version
    validations:
      required: true
  - type: textarea
    attributes:
      label: Additional context
      description: Add safe logs or screenshots. Remove private information and secrets.
