[project]
name = "numerical-error-analysis-studio"
version = "1.2.0"
description = "Interactive Taylor-series, floating-point error, and false-convergence laboratory"
readme = "README.md"
license = "MIT"
authors = [{name = "Jason and contributors"}]
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<3",
  "mpmath>=1.3,<2",
  "pandas>=2.1,<3",
  "plotly>=5.20,<8",
  "streamlit>=1.41,<2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[project.urls]
Repository = "https://github.com/OWNER/numerical-error-analysis-studio"
Issues = "https://github.com/OWNER/numerical-error-analysis-studio/issues"
